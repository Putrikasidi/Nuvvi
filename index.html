<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nuvvi | Track Your Health, Build Better Habits</title>
    <link rel="icon" href="assets/img/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/output.css" />
  </head>
  <body class="bg-leaf font-sans text-cocoa" data-page="home">
    <!-- Navbar -->
    <header class="relative z-20">
      <nav class="mx-auto flex max-w-7xl flex-wrap items-center gap-3 px-4 py-4 md:px-8">
        <a href="index.html" class="mr-auto flex items-center gap-2 md:mr-0">
          <img src="assets/img/logo.png" alt="Logo Nuvvi" class="h-10 w-10 rounded-full object-cover" />
          <span class="font-display text-2xl font-bold">Nuvvi</span>
        </a>
        <button
          type="button"
          data-nav-toggle
          aria-label="Buka menu"
          class="rounded-2xl bg-white/70 p-2 text-cocoa md:hidden"
        >
          <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M4 7h16M4 12h16M4 17h16" />
          </svg>
        </button>
        <div
          data-nav-menu
          class="hidden w-full flex-col gap-2 py-2 md:flex md:w-auto md:flex-1 md:flex-row md:items-center md:gap-1 md:py-0"
        >
          <a href="index.html" class="nv-nav-pill nv-nav-pill--active">Home</a>
          <a href="pricing.html" class="nv-nav-pill">Pricing</a>
          <span class="hidden md:block md:flex-1" aria-hidden="true"></span>
          <a href="dashboard.html" class="nv-nav-pill">Try me!</a>
          <a href="login.html" class="nv-nav-pill">Login</a>
        </div>
      </nav>
    </header>

    <!-- Hero -->
    <section class="relative lg:-mt-24">
      <div class="nv-reveal lg:absolute lg:inset-0 lg:z-10">
        <div class="mx-auto flex h-full max-w-7xl items-center px-4 pt-8 md:px-8 lg:pt-24">
          <div class="flex max-w-xl flex-col">
            <h1 class="font-display text-4xl font-bold leading-tight sm:text-5xl">
              Track Your Health,<br />Build Better Habits
            </h1>
            <p class="mt-5 max-w-md text-lg text-cocoa/80">
              Dari makanan sampai olahraga, Nuvvi bantu kamu jaga kebiasaan sehat tiap hari.
            </p>
            <a href="dashboard.html" class="nv-btn nv-btn--primary mt-8 self-start !px-8 !py-3 text-lg">Start</a>
          </div>
        </div>
      </div>
      <img src="assets/img/hero-illustration.png?v=2" alt="Ilustrasi aplikasi Nuvvi" width="1366" height="768" class="nv-reveal ml-auto block w-full lg:w-[62%]" />
    </section>

    <!-- Fitur -->
    <section id="fitur" class="scroll-mt-8 mt-16 pb-16 lg:mt-28">
      <div class="mx-auto max-w-7xl px-4 md:px-8">
        <div class="nv-reveal flex flex-wrap items-center justify-between gap-x-3 gap-y-2">
          <button type="button" data-feature-tab="dashboard" class="nv-nav-pill nv-nav-pill--active flex items-center gap-2">
            <svg class="h-5 w-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
            Dashboard
          </button>
          <button type="button" data-feature-tab="mealplan" class="nv-nav-pill flex items-center gap-2">
            <svg class="h-5 w-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a2 2 0 0 1 2-2h2l1.5-2h7L19 6h2a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><circle cx="12" cy="13" r="3.5"/></svg>
            Meal Plan
          </button>
          <button type="button" data-feature-tab="sport" class="nv-nav-pill flex items-center gap-2">
            <svg class="h-5 w-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="15" cy="5" r="2"/><path d="m8 21 2-5 3-2-1-4-4 2-1 3"/><path d="m13 14 3 2 3-1"/><path d="M10 9 6 8"/></svg>
            Sport Plan
          </button>
          <button type="button" data-feature-tab="wellness" class="nv-nav-pill flex items-center gap-2">
            <svg class="h-5 w-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.5-9.5-9C1 8 2.5 4.5 6 4.5c2 0 3.2 1 4 2.2.8-1.2 2-2.2 4-2.2 3.5 0 5 3.5 3.5 6.5C19 15.5 12 20 12 20Z"/></svg>
            Wellness
          </button>
          <button type="button" data-feature-tab="komunitas" class="nv-nav-pill flex items-center gap-2">
            <svg class="h-5 w-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><path d="M3.5 20a5.5 5.5 0 0 1 11 0"/><path d="M16 6a3 3 0 0 1 0 6"/><path d="M18 20a5.5 5.5 0 0 0-3-4.9"/></svg>
            Komunitas
          </button>
        </div>

        <div class="nv-reveal mt-6 overflow-hidden rounded-card bg-white p-3 shadow-soft md:p-5">
          <img
            id="nv-feature-image"
            src="assets/img/preview-dashboard.png"
            alt="Tampilan Dashboard"
            class="mx-auto w-full max-w-6xl rounded-2xl bg-white shadow-soft"
          />
        </div>
      </div>
    </section>

    <!-- CTA harga -->
    <section class="py-16">
      <div class="mx-auto max-w-5xl px-4 md:px-8">
        <div class="nv-reveal rounded-card bg-forest px-6 py-10 text-center text-white shadow-soft md:px-12">
          <h2 class="font-display text-3xl font-bold md:text-4xl">Coba gratis selama 1 minggu</h2>
          <p class="mx-auto mt-3 max-w-xl text-white/80">
            Akses semua fitur premium Nuvvi tanpa biaya. Lihat pilihan paketnya di halaman harga.
          </p>
          <div class="mt-7 flex flex-wrap justify-center gap-3">
            <a href="pricing.html" class="nv-btn !bg-sun !text-cocoa">Lihat Harga</a>
            <a href="register.html" class="nv-btn nv-btn--ghost">Buat Akun</a>
          </div>
        </div>
      </div>
    </section>

    <!-- Footer -->
    <div data-site-footer></div>

    <script src="assets/js/storage.js"></script>
    <script src="assets/js/data.js"></script>
    <script src="assets/js/layout.js"></script>
    <script src="assets/js/app.js"></script>
  </body>
</html>
