<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login | Nuvvi</title>
    <link rel="icon" href="assets/img/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/output.css" />
  </head>
  <body class="relative flex min-h-screen flex-col bg-leaf font-sans text-cocoa" data-page="login">
    <header class="relative z-20">
      <nav class="mx-auto flex max-w-7xl items-center gap-3 px-4 py-4 md:px-8">
        <a href="index.html" class="mr-auto flex items-center gap-2">
          <img src="assets/img/logo.png" alt="Logo Nuvvi" class="h-10 w-10 rounded-full object-cover" />
          <span class="font-display text-2xl font-bold">Nuvvi</span>
        </a>
        <button type="button" data-nav-toggle aria-label="Buka menu" class="rounded-2xl bg-white/70 p-2 text-cocoa md:hidden">
          <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M4 7h16M4 12h16M4 17h16" />
          </svg>
        </button>
        <div class="hidden md:flex md:items-center md:gap-1 md:mr-40 lg:mr-56">
          <a href="index.html" class="nv-nav-pill">Home</a>
          <a href="pricing.html" class="nv-nav-pill">Pricing</a>
        </div>
      </nav>
      <div class="absolute right-4 top-0 hidden h-full items-center gap-1 md:right-8 md:flex">
        <a href="dashboard.html" class="nv-nav-pill">Try me!</a>
        <a href="login.html" class="nv-nav-pill nv-nav-pill--active">Login</a>
      </div>
      <div data-nav-menu class="absolute inset-x-0 top-full z-30 hidden flex-col gap-2 bg-leaf/95 px-6 pb-4 backdrop-blur md:hidden">
        <a href="index.html" class="nv-nav-pill">Home</a>
        <a href="pricing.html" class="nv-nav-pill">Pricing</a>
        <a href="dashboard.html" class="nv-nav-pill">Try me!</a>
        <a href="login.html" class="nv-nav-pill nv-nav-pill--active">Login</a>
      </div>
    </header>

    <main class="relative z-10 mx-auto flex w-full max-w-md flex-1 flex-col justify-center px-6 py-10">
      <h1 class="text-center font-display text-5xl font-bold text-forest">LOGIN</h1>
      <p class="mt-2 text-center text-forest/80">Sign in to continue</p>

      <form data-auth="login" class="mt-10 space-y-5">
        <div>
          <label class="mb-1 block font-display font-bold" for="email">EMAIL</label>
          <input id="email" name="email" type="email" required placeholder="nama@email.com" class="nv-input" />
        </div>
        <div>
          <label class="mb-1 block font-display font-bold" for="password">PASSWORD</label>
          <input id="password" name="password" type="password" required placeholder="******" class="nv-input" />
        </div>
        <button type="submit" class="nv-btn nv-btn--primary w-full">Login</button>
      </form>

      <p class="mt-6 text-center text-forest/80">
        Belum punya akun?
        <a href="register.html" class="font-bold underline">Daftar di sini</a>
      </p>
    </main>

    <svg class="block h-20 w-full sm:h-28" viewBox="0 0 1440 300" preserveAspectRatio="none" aria-hidden="true">
      <path fill="#BBD98C" fill-opacity="0.75" d="M0,300 L0,200 Q180,60 360,95 Q540,130 720,170 Q900,130 1080,95 Q1260,60 1440,200 L1440,300 Z" />
      <path fill="#A6CE79" fill-opacity="0.85" d="M0,300 L0,240 Q180,110 360,150 Q540,190 720,220 Q900,190 1080,150 Q1260,110 1440,240 L1440,300 Z" />
    </svg>
    <div data-site-footer></div>

    <script src="assets/js/storage.js"></script>
    <script src="assets/js/data.js"></script>
    <script src="assets/js/layout.js"></script>
    <script src="assets/js/app.js"></script>
  </body>
</html>
