<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Meal Plan | Nuvvi</title>
    <link rel="icon" href="assets/img/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Nunito:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/output.css" />
  </head>
  <body class="bg-cream font-sans text-cocoa" data-page="meal-plan">
    <div class="lg:flex lg:h-screen lg:overflow-hidden">
      <aside id="app-sidebar"></aside>
      <div class="flex min-h-screen min-w-0 flex-1 flex-col lg:h-screen lg:min-h-0 lg:overflow-y-auto">
        <header id="app-topbar" class="sticky top-0 z-20 bg-cream/95 backdrop-blur"></header>

        <main class="flex-1 bg-sage p-4 sm:p-6 lg:p-8">
          <div class="grid gap-5 lg:grid-cols-2">
              <!-- Upload -->
              <div class="space-y-5">
                <label
                  class="flex min-h-[260px] cursor-pointer flex-col items-center justify-center gap-2 rounded-card border-2 border-dashed border-cocoa/40 bg-white p-6 text-center shadow-soft"
                >
                  <input id="nv-upload-input" type="file" accept="image/png,image/jpeg" class="sr-only" />
                  <img id="nv-upload-preview" alt="Pratinjau foto makanan" class="hidden max-h-56 rounded-2xl object-contain" />
                  <span id="nv-upload-placeholder" class="flex flex-col items-center gap-2 text-cocoa/70">
                    <svg class="h-16 w-16" viewBox="0 0 24 24" aria-hidden="true">
                      <path
                        fill="currentColor"
                        d="M9 4.5c0-.28.22-.5.5-.5h5c.28 0 .5.22.5.5L15.6 7H19a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h3.4L9 4.5Z"
                      />
                      <circle cx="12" cy="13.5" r="4" fill="#fff" />
                      <circle cx="18" cy="9.3" r="0.9" fill="#fff" />
                    </svg>
                    <span class="font-display text-lg font-bold text-cocoa">Upload Foto Makanan</span>
                    <span class="text-sm">(JPG, PNG, Maks 5 MB)</span>
                  </span>
                </label>

                <!-- Kamera -->
                <button type="button" id="nv-camera-open" class="nv-btn nv-btn--primary flex w-full items-center justify-center gap-2">
                  <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M9 4.5 8 7H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-1-2.5H9Z" />
                    <circle cx="12" cy="13" r="3.5" />
                  </svg>
                  Ambil Foto Langsung
                </button>

                <div id="nv-camera-panel" class="hidden overflow-hidden rounded-card bg-white p-3 shadow-soft">
                  <video id="nv-camera-video" playsinline autoplay muted class="w-full rounded-2xl" style="background:#000; aspect-ratio:16/9; object-fit:cover"></video>
                  <div class="mt-3 flex gap-3">
                    <button type="button" id="nv-camera-shot" class="nv-btn nv-btn--primary flex-1">Jepret Foto</button>
                    <button type="button" id="nv-camera-close" class="nv-btn nv-btn--ghost">Batal</button>
                  </div>
                </div>
                <canvas id="nv-camera-canvas" class="hidden"></canvas>

                <div id="nv-scan-result" class="hidden rounded-card bg-leaf/50 p-5"></div>
              </div>

              <!-- Your Meal Plan -->
              <div class="nv-card">
                <h3 class="mb-4 font-display text-xl font-bold">Your Meal Plan</h3>
                <ul id="nv-meal-plan" class="space-y-5"></ul>
              </div>
            </div>

            <!-- Recommended For You -->
            <div class="nv-card mt-6">
              <div class="mb-4">
                <h3 class="font-display text-xl font-bold">Recommended For You</h3>
                <p class="text-sm text-cocoa/60">Berdasarkan asupan nutrisimu hari ini</p>
              </div>
              <div id="nv-recommended-meals" class="grid gap-4 sm:grid-cols-3"></div>
            </div>
        </main>
      </div>
    </div>

    <div id="app-backdrop" class="fixed inset-0 z-40 hidden bg-black/30 lg:hidden"></div>

    <script src="assets/js/storage.js"></script>
    <script src="assets/js/data.js"></script>
    <script src="assets/js/layout.js"></script>
    <script src="assets/js/app.js"></script>
  </body>
</html>
