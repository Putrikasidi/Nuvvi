<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Create Account | Nuvvi</title>
    <link rel="icon" href="assets/img/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Nunito:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/output.css" />
  </head>
  <body class="relative flex min-h-screen flex-col bg-leaf font-sans text-cocoa" data-page="register">
    <header class="relative z-10 flex items-center justify-between px-6 py-5 md:px-10">
      <a href="index.html" class="flex items-center gap-2">
        <img src="assets/img/logo.png" alt="Logo Nuvvi" class="h-10 w-10 rounded-full object-cover" />
        <span class="font-display text-2xl font-bold">Nuvvi</span>
      </a>
    </header>

    <main class="relative z-10 mx-auto flex w-full max-w-md flex-1 flex-col justify-center px-6 py-10">
      <h1 class="text-center font-display text-4xl font-bold leading-tight text-forest sm:text-5xl">
        CREATE ACCOUNT
      </h1>
      <p class="mt-2 text-center text-forest/80">
        Already Registered ?
        <a href="login.html" class="font-bold underline">Log In Here</a>
      </p>

      <form data-auth="register" class="mt-10 space-y-5">
        <div>
          <label class="mb-1 block font-display font-bold" for="name">NAMA</label>
          <input id="name" name="name" type="text" required placeholder="Nama kamu" class="nv-input" />
        </div>
        <div>
          <label class="mb-1 block font-display font-bold" for="email">EMAIL</label>
          <input id="email" name="email" type="email" required placeholder="nama@email.com" class="nv-input" />
        </div>
        <div>
          <label class="mb-1 block font-display font-bold" for="password">PASSWORD</label>
          <input id="password" name="password" type="password" required placeholder="******" class="nv-input" />
        </div>
        <button type="submit" class="nv-btn nv-btn--primary w-full">Sign Up</button>
      </form>
    </main>

    <svg class="block h-20 w-full sm:h-28" viewBox="0 0 1440 300" preserveAspectRatio="none" aria-hidden="true">
      <path fill="#BBD98C" fill-opacity="0.75" d="M0,300 L0,200 Q180,60 360,95 Q540,130 720,170 Q900,130 1080,95 Q1260,60 1440,200 L1440,300 Z" />
      <path fill="#A6CE79" fill-opacity="0.85" d="M0,300 L0,240 Q180,110 360,150 Q540,190 720,220 Q900,190 1080,150 Q1260,110 1440,240 L1440,300 Z" />
    </svg>
    <div data-site-footer></div>

    <script src="assets/js/storage.js"></script>
    <script src="assets/js/data.js"></script>
    <script src="assets/js/layout.js"></script>
    <script src="assets/js/app.js"></script>
  </body>
</html>
