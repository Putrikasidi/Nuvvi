<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sport Plan | Nuvvi</title>
    <link rel="icon" href="assets/img/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Nunito:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/output.css" />
  </head>
  <body class="bg-cream font-sans text-cocoa" data-page="sport-plan">
    <div class="lg:flex lg:h-screen lg:overflow-hidden">
      <aside id="app-sidebar"></aside>
      <div class="flex min-h-screen min-w-0 flex-1 flex-col lg:h-screen lg:min-h-0 lg:overflow-y-auto">
        <header id="app-topbar" class="sticky top-0 z-20 bg-cream/95 backdrop-blur"></header>

        <main class="flex-1 space-y-5 bg-sage p-4 sm:p-6 lg:p-8">
            <!-- Header + tanggal -->
            <div class="rounded-card bg-sun p-6">
              <div class="flex items-start justify-between gap-3">
                <div>
                  <h2 class="font-display text-3xl font-bold">Sport Plan</h2>
                  <p class="text-cocoa/80">Yuk semangat olahraga bareng!</p>
                </div>
                <img src="assets/img/mascot-vivi-sign.png" alt="" class="pointer-events-none -my-2 w-20 shrink-0 self-center sm:w-24 md:w-28" />
              </div>
              <div id="nv-sport-dates" class="nv-scroll-row nv-no-scrollbar mt-4"></div>
            </div>

            <div class="grid gap-5 lg:grid-cols-2">
              <!-- Weekly Activity -->
              <div class="nv-card">
                <div class="mb-4 flex items-start justify-between">
                  <div>
                    <h3 class="font-display text-xl font-bold">Weekly Activity</h3>
                    <p class="text-sm text-cocoa/60">Pantau aktivitasmu biar tetap konsisten</p>
                  </div>
                  <span class="rounded-md bg-sky px-3 py-1 text-sm font-bold">This week</span>
                </div>
                <div id="nv-weekly-chart"></div>
                <p id="nv-weekly-summary" class="mt-3 text-center text-sm font-bold text-cocoa/70">Klik salah satu batang untuk lihat rinciannya</p>
              </div>

              <!-- Activity Summary -->
              <div class="nv-card">
                <div class="mb-4 flex items-center justify-between">
                  <h3 class="font-display text-xl font-bold">Your Activity Summary</h3>
                  <span class="text-sm font-bold text-forest">See Detail &rsaquo;</span>
                </div>
                <div id="nv-activity-summary" class="flex flex-wrap items-center gap-6"></div>
                <p class="mt-4 rounded-md bg-sage-dark px-4 py-2 text-center text-sm font-bold text-white">
                  Kamu keren! Lanjut terus sampai target harian tercapai.
                </p>
              </div>
            </div>

            <!-- Recommended Workouts -->
            <div class="nv-card">
              <h3 class="mb-4 font-display text-xl font-bold">Recommended Workouts</h3>
              <div id="nv-workouts" class="grid grid-cols-2 gap-4 lg:grid-cols-4"></div>
            </div>
        </main>
      </div>
    </div>

    <div id="app-backdrop" class="fixed inset-0 z-40 hidden bg-black/30 lg:hidden"></div>

    <script src="assets/js/storage.js"></script>
    <script src="assets/js/data.js"></script>
    <script src="assets/js/layout.js"></script>
    <script src="assets/js/app.js"></script>
  </body>
</html>
