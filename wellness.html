<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wellness — Nuvvi</title>
    <link rel="icon" href="assets/img/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/output.css" />
  </head>
  <body class="bg-cream font-sans text-cocoa" data-page="wellness">
    <div class="lg:flex">
      <aside id="app-sidebar"></aside>
      <div class="flex min-h-screen min-w-0 flex-1 flex-col">
        <header id="app-topbar" class="sticky top-0 z-20 bg-cream/95 backdrop-blur"></header>

        <main class="flex-1 p-3 sm:p-5 lg:p-6">
          <div class="space-y-5 rounded-card bg-sage p-4 sm:p-6">
            <!-- Header -->
            <div class="relative overflow-hidden rounded-card bg-sky p-6">
              <h2 class="font-display text-3xl font-extrabold">Wellness</h2>
              <p class="text-cocoa/70">Your personal assistant</p>
              <a href="wellness-quiz.html" class="nv-btn nv-btn--primary mt-4">Atur asisten</a>
              <img src="assets/img/mascot-vivi-crossed.png" alt="" class="pointer-events-none absolute -bottom-2 right-3 w-24 sm:w-32" />
            </div>

            <div class="grid gap-5 lg:grid-cols-2">
              <!-- Jadwal Hari Ini -->
              <div class="nv-card">
                <div class="mb-1 flex items-center justify-between">
                  <h3 class="font-display text-xl font-extrabold">Jadwal Hari Ini</h3>
                  <button type="button" class="rounded-pill bg-sky px-4 py-1 text-sm font-bold">Kalender</button>
                </div>
                <p class="mb-4 text-sm text-cocoa/60">Rabu, 9 September 2026</p>
                <ul id="nv-schedule" class="space-y-3"></ul>
              </div>

              <!-- Progress Harian -->
              <div class="nv-card">
                <div class="mb-4 flex items-center justify-between">
                  <h3 class="font-display text-xl font-extrabold">Progress Harian</h3>
                  <span class="text-sm font-bold text-amber-cta">Lihat detail &rsaquo;</span>
                </div>
                <div id="nv-progress-rings" class="grid grid-cols-1 gap-4 sm:grid-cols-2"></div>
                <img src="assets/img/mascot-nuna-hug.png" alt="" class="ml-auto mt-2 w-24" />
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>

    <div id="app-backdrop" class="fixed inset-0 z-40 hidden bg-black/30 lg:hidden"></div>

    <script src="assets/js/storage.js"></script>
    <script src="assets/js/data.js"></script>
    <script src="assets/js/layout.js"></script>
    <script src="assets/js/app.js"></script>
  </body>
</html>
