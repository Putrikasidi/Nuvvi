<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wellness | Nuvvi</title>
    <link rel="icon" href="assets/img/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/output.css" />
  </head>
  <body class="bg-cream font-sans text-cocoa" data-page="wellness">
    <div class="lg:flex lg:h-screen lg:overflow-hidden">
      <aside id="app-sidebar"></aside>
      <div class="flex min-h-screen min-w-0 flex-1 flex-col lg:h-screen lg:min-h-0 lg:overflow-y-auto">
        <header id="app-topbar" class="sticky top-0 z-20 bg-cream/95 backdrop-blur"></header>

        <main class="flex-1 space-y-5 bg-sage p-4 sm:p-6 lg:p-8">
            <!-- Header -->
            <div class="relative rounded-card bg-sky p-6">
              <div class="max-w-[70%] sm:max-w-[75%]">
                <h2 class="font-display text-3xl font-bold">Wellness</h2>
                <p class="text-cocoa/70">Your personal assistant</p>
                <a href="wellness-quiz.html" class="nv-btn nv-btn--primary mt-4">Atur asisten</a>
              </div>
              <img src="assets/img/mascot-vivi-crossed.png" alt="" class="pointer-events-none absolute -bottom-2 right-3 w-32 sm:w-44" />
            </div>

            <div class="grid gap-5 lg:grid-cols-2">
              <!-- Jadwal Hari Ini -->
              <div class="nv-card flex flex-col">
                <h3 class="font-display text-xl font-bold">Jadwal Hari Ini</h3>
                <p id="nv-today-date" class="mb-4 text-sm text-cocoa/60"></p>
                <ul id="nv-schedule" class="min-h-0 flex-1 space-y-3 overflow-y-auto pr-1"></ul>
              </div>

              <!-- Progress + Kondisi -->
              <div class="space-y-5">
                <div class="nv-card">
                  <h3 class="mb-4 font-display text-xl font-bold">Progress Harian</h3>
                  <div id="nv-progress-rings" class="grid grid-cols-1 gap-4 sm:grid-cols-2"></div>
                </div>

                <div class="nv-card">
                  <h3 class="font-display text-xl font-bold">Kondisi Kesehatan &amp; Obat</h3>
                  <p class="mb-4 text-sm text-cocoa/60">Punya kondisi tertentu? Kasih tahu di sini biar pengingatnya pas.</p>

                  <p class="mb-2 text-sm font-bold text-cocoa">Kondisi yang kamu punya</p>
                  <div id="nv-conditions" class="flex flex-wrap gap-2"></div>
                  <p id="nv-condition-tip" class="mt-3 rounded-2xl bg-sky-soft/60 px-3 py-2 text-sm text-cocoa/70"></p>

                  <p class="mb-2 mt-6 text-sm font-bold text-cocoa">Obat hari ini</p>
                  <ul id="nv-meds" class="space-y-3"></ul>
                </div>
              </div>
            </div>
        </main>
      </div>
    </div>

    <div id="app-backdrop" class="fixed inset-0 z-40 hidden bg-black/30 lg:hidden"></div>

    <script src="assets/js/storage.js"></script>
    <script src="assets/js/data.js"></script>
    <script src="assets/js/layout.js"></script>
    <script src="assets/js/app.js"></script>
  </body>
</html>
